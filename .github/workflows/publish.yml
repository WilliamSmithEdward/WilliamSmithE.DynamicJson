name: Publish

# A version tag publishes the package to nuget.org and creates the GitHub
# release.
#
# Trusted publishing: nuget.org is told, once, in its own web interface,
# that this repository, this workflow file and the nuget environment may
# publish WilliamSmithE.DynamicJson for the nuget.org account WilliamSmithE.
# GitHub signs a short-lived token for the run, NuGet/login trades it for an
# API key that lasts an hour, and no long-lived API key is created, stored or
# rotated anywhere. Renaming this file or the environment breaks it.
#
# To release, set Version in
# WilliamSmithE.DynamicJson/WilliamSmithE.DynamicJson.csproj, write the
# version's section in CHANGELOG.md, then:
#
#   git tag v1.2.3
#   git push origin v1.2.3
#
# The tag is the package version (PackageVersion, which the csproj's Version
# sets) with a v in front, and the build refuses a
# mismatch rather than publishing it. The release waits on Security and the
# Malware scan of the tagged commit, and the scan reads the very package
# that is pushed.
#
# Started by hand, it is always a dry run: it builds, scans and assembles the
# release files exactly as a release would, and uploads them as the
# release-preview artifact instead of publishing anything.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the NuGet package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # First, so a mistyped tag fails in seconds. A tag that says one thing
      # and a package that says another puts a release on nuget.org under a
      # number nobody chose, and a number on nuget.org can never be used
      # again.
      - name: Read the package version and check the tag matches it
        id: version
        run: |
          version=$(dotnet msbuild WilliamSmithE.DynamicJson/WilliamSmithE.DynamicJson.csproj -getProperty:PackageVersion)
          echo "PackageVersion: $version"
          [ -n "$version" ] || { echo "no PackageVersion in the csproj"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            tagged="${GITHUB_REF_NAME#v}"
            if [ "$tagged" != "$version" ]; then
              echo "tag v$tagged does not match PackageVersion $version in the csproj"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore from the lock file
        run: dotnet restore WilliamSmithE.DynamicJson.slnx --locked-mode

      - name: Build Release with warnings as errors
        run: dotnet build WilliamSmithE.DynamicJson.slnx --no-restore -c Release -warnaserror

      - name: Pack
        run: dotnet pack WilliamSmithE.DynamicJson.slnx --no-build -c Release -o dist

      - name: Check the package holds each framework's dll and XML docs, the README and the icon
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -- dist/*.nupkg
          [ "$#" -eq 1 ] && [ "$1" = "dist/WilliamSmithE.DynamicJson.$VERSION.nupkg" ] || { echo "want dist/WilliamSmithE.DynamicJson.$VERSION.nupkg alone, found: $*"; exit 1; }
          unzip -Z1 "$1" > contents.txt
          cat contents.txt
          for tfm in net8.0 net9.0 net10.0; do
            for ext in dll xml; do
              want="lib/$tfm/WilliamSmithE.DynamicJson.$ext"
              grep -qxF "$want" contents.txt || { echo "missing from the package: $want"; exit 1; }
            done
          done
          for want in NUGET_README.md DynamicJsonLogo.png; do
            grep -qxF "$want" contents.txt || { echo "missing from the package: $want"; exit 1; }
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg
          path: dist/
          if-no-files-found: error

  # The tagged commit's scans. A finding the accepted list does not account
  # for fails this job, and nothing is published.
  security:
    name: Security
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  # ClamAV and YARA-X over the tagged commit's files and the package the
  # build job made, held to their own accepted list the same way.
  malware-scan:
    name: Malware scan
    needs: [build]
    uses: ./.github/workflows/malware-scan.yml
    with:
      package-artifact: nupkg
    permissions:
      contents: read

  publish:
    name: Publish to NuGet
    needs: [build, security, malware-scan]
    # Only for a pushed tag. A run started by hand, even on a tag, would push
    # whatever version the csproj held, and a version on nuget.org can never
    # be used again.
    if: ${{ github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The environment is where nuget.org's trusted publishing policy is
    # pinned, and where a required reviewer can be added if a release should
    # need one.
    environment:
      name: nuget
      url: https://www.nuget.org/packages/WilliamSmithE.DynamicJson
    permissions:
      # What lets GitHub mint the short-lived token nuget.org checks. Nothing
      # else in this file needs it, and nothing else gets it.
      id-token: write
      attestations: write # store the provenance attestation
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      # Only global.json, so the push runs on the pinned SDK. Nothing is built.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: global.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg
          path: dist/

      # Signed build provenance: `gh attestation verify <file> --owner
      # WilliamSmithEdward` shows which commit and run built the package.
      - name: Attest the package
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.nupkg

      # The signed bundle goes on the GitHub release too, so a download can be
      # checked offline: gh attestation verify <file> --bundle <bundle>.
      - name: Keep the provenance bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error

      - name: Get a short-lived nuget.org API key
        id: login
        if: github.event_name != 'workflow_dispatch'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: WilliamSmithE

      - name: Push the package to nuget.org
        if: github.event_name != 'workflow_dispatch'
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          dotnet nuget push "dist/WilliamSmithE.DynamicJson.$VERSION.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json

  # On a dry run `publish` is skipped; this job still assembles the release
  # and uploads it as an artifact, and only the last step is skipped.
  github-release:
    name: Create GitHub release
    needs: [build, publish, security, malware-scan]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success'
      && needs.security.result == 'success' && needs.malware-scan.result == 'success'
      && (needs.publish.result == 'success'
      || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # creating the release
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg
          path: dist/

      - name: Download the security report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-report
          path: security-report/

      - name: Download the malware report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: malware-report
          path: security-report/

      - name: Download the provenance bundle
        if: env.DRY_RUN != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provenance
          path: provenance/

      # Both reports and what they were made from, named for the release:
      # WilliamSmithE.DynamicJson-1.2.3-security-report.md,
      # WilliamSmithE.DynamicJson-1.2.3-semgrep.sarif,
      # WilliamSmithE.DynamicJson-1.2.3-malware-report.md,
      # WilliamSmithE.DynamicJson-1.2.3-clamav.json, and the provenance bundle as
      # WilliamSmithE.DynamicJson-1.2.3.sigstore.json.
      - name: Name the reports after the release
        run: |
          [ -n "$VERSION" ] || { echo "the build job gave no version"; exit 1; }
          for file in security-report/*; do
            mv "$file" "security-report/WilliamSmithE.DynamicJson-$VERSION-$(basename "$file")"
          done
          if [ "$DRY_RUN" != true ]; then
            test "$(find provenance -type f | wc -l)" = 1
            mv provenance/* "provenance/WilliamSmithE.DynamicJson-$VERSION.sigstore.json"
          fi

      # The version's section of CHANGELOG.md, the notes written for it. A
      # release without one fails here rather than going out with no notes.
      - name: Extract the changelog section for this version
        id: notes
        run: |
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { capture=1; found=1; next }
            capture && /^## \[/ { exit }
            capture { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release_notes.md || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
          if ! grep -q '[^[:space:]]' release_notes.md; then
            echo "CHANGELOG.md's section for $VERSION is empty"
            exit 1
          fi
          cat release_notes.md
          echo "notes_file=release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Keep what the release would carry
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-preview
          path: |
            dist/
            security-report/
            release_notes.md
          if-no-files-found: error

      - name: Create the GitHub release
        if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # The title is the tag and nothing else. The headline is in the body.
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.notes_file }}
          files: |
            dist/*
            security-report/*
            provenance/*
          fail_on_unmatched_files: true
